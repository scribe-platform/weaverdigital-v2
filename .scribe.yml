site: weaverdigital-v2
siteName: Weaver Digital
turnstileSiteKey: 0x4AAAAAAFHtLCWg1S7IznJp
contactCollection: inquiries
umamiWebsiteId: c7ea2f59-2f58-43c4-9175-839f60f5fe5f
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
collections:
  - name: posts
    label: Posts
    path: content/posts
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        required: true
      - name: heroImage
        type: image
      - name: body
        type: rich-text
        isBody: true
  - name: inquiries
    label: Inquiries
    path: content/inquiries
    format: yaml
    form: true
    workflow:
      states:
        - { name: new,      label: New,                 kind: needs-you }
        - { name: open,     label: Open,                kind: needs-you }
        - { name: waiting,  label: Waiting on customer, kind: waiting }
        - { name: done,     label: Done,                kind: closed }
        - { name: archived, label: Archived,            kind: closed, hidden: true }
    fields:
      - name: name
        type: string
        required: true
      - name: email
        type: string
        required: true
      - name: phone
        type: string
      - name: business
        type: string
        label: Business name
      - name: message
        type: text
        required: true
